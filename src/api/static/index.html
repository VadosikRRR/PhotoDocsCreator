<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta charset="utf-8" />
        <title>Обработка изображений</title>
        <link rel="stylesheet" href="/static/index.css"/>
    </head>
    <body>
        <div class="process_manu">
            <div class="group">
                <h1>Загрузите изображение для обработки</h1>
                <form id="uploadForm" enctype="multipart/form-data">
                    <input type="file" name="file" accept="image/*" id="fileInput">
                    <input type="submit" value="Обработать">
                </form>
                
                <div id="loadingIndicator" class="loading-indicator">
                    <div class="spinner"></div>
                    <p>Подождите, пожалуйста</p>
                </div>
                
                <div class="images-container" id="imagesContainer" style="display: none;">
                    <div class="image-box">
                        <h2>Исходное изображение</h2>
                        <img id="originalImage" alt="Исходное изображение">
                    </div>
                    <div class="image-box">
                        <h2>Результат обработки</h2>
                        <img id="processedImage" alt="Обработанное изображение">
                        <div class="download-section">
                            <a id="downloadLink" class="download-btn">Скачать результат</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <script src="/static/script.js"></script>
    </body>
</html>
